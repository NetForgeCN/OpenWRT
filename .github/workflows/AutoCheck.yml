name: Auto Update Check

on:
  # 允许手动检查
  workflow_dispatch:

  # 每天北京时间凌晨 5 点（UTC 21:17，避开整点调度高峰）
  schedule:
    - cron: '17 21 * * *'

permissions:
  contents: write

# 防止多个检查任务同时修改状态文件
concurrency:
  group: auto-update-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ======================================================
      # 1. 获取当前工作流仓库
      # ======================================================

      - name: Checkout workflow repository
        uses: actions/checkout@v7

      # ======================================================
      # 2. 检查全部第三方组件
      #    清单必须与 diy-part1.sh 的 feeds + diy-part2.sh 的
      #    git clone 保持一致，新增依赖时两边同步改。
      # ======================================================

      - name: Check third-party repositories
        id: check
        shell: bash
        run: |
          set -Eeuo pipefail

          STATE_FILE=".github/upstream-state/previous.txt"
          TEMP_FILE="$(mktemp)"
          trap 'rm -f "$TEMP_FILE"' EXIT

          # ==================================================
          # feeds（diy-part1.sh）
          # ==================================================
          #
          # DDNS-GO
          # KixDNS
          # Diskman
          # DAE
          # OpenNextTrace
          # Airplay2
          # Honk
          # Photondns
          #
          # ==================================================
          # git clone 直接克隆（diy-part2.sh）
          # ==================================================
          #
          # v2ray-geodata（替换官方包）
          # Temp Status
          # Argon 主题
          # Pulse
          # Oxidns
          #
          # ==================================================

          declare -A REPOS=(
            ["ddnsgo"]="sirpdboy/luci-app-ddns-go"
            ["kixdns"]="JohnsonRan/luci-app-kixdns"
            ["diskman"]="sbwml/luci-app-diskman"
            ["dae"]="QiuSimons/luci-app-dae"
            ["opennexttrace"]="haohaoget/luci-app-open_nexttrace"
            ["airplay2"]="NetForgeCN/luci-app-airplay2"
            ["honk"]="QiuSimons/luci-app-honk"
            ["photondns"]="c2h2/luci-app-photondns"
            ["v2ray-geodata"]="NetForgeCN/Loyalsoldier"
            ["temp-status"]="gSpotx2f/luci-app-temp-status"
            ["argon"]="jerrykuku/luci-theme-argon"
            ["pulse"]="w9315273/luci-app-pulse"
            ["oxidns"]="NetForgeCN/luci-app-oxidns"
          )

          declare -A OLD_HASHES=()

          BASELINE=false
          UPDATED=false
          FAILED=""

          echo "=================================================="
          echo " 检查第三方组件上游更新"
          echo "=================================================="

          # 读取上次检查记录
          if [ -f "$STATE_FILE" ]; then
            while read -r name hash; do
              [ -n "${name:-}" ] || continue
              [ -n "${hash:-}" ] || continue

              OLD_HASHES["$name"]="$hash"
            done < "$STATE_FILE"
          else
            BASELINE=true
            echo "首次运行，将建立上游提交基线。"
          fi

          # 检查每个仓库的默认分支 HEAD
          for name in "${!REPOS[@]}"; do
            repo="${REPOS[$name]}"

            echo
            echo "检查组件：$name"
            echo "仓库地址：https://github.com/$repo"

            hash="$(
              git ls-remote \
                "https://github.com/${repo}.git" \
                HEAD |
              awk 'NR == 1 { print $1 }'
            )"

            # 单个仓库检查失败不再让整个监控挂掉：
            # 保留旧 hash、继续检查其他组件，最后统一标记失败
            if [ -z "$hash" ]; then
              echo "❌ 获取仓库提交失败：$repo（保留旧状态）"
              FAILED="$FAILED $name"

              old_hash="${OLD_HASHES[$name]:-}"
              [ -n "$old_hash" ] && printf '%s %s\n' "$name" "$old_hash" >> "$TEMP_FILE"
              continue
            fi

            printf '%s %s\n' "$name" "$hash" >> "$TEMP_FILE"

            old_hash="${OLD_HASHES[$name]:-}"

            if [ "$BASELINE" = "true" ]; then
              echo "建立基线：$name $hash"

            elif [ -z "$old_hash" ]; then
              echo "⚠️ 新增监控组件：$name"
              echo "   视为发生变化，需要触发编译。"

              UPDATED=true

            elif [ "$hash" != "$old_hash" ]; then
              echo "✅ 检测到更新：$name"
              echo "   旧提交：$old_hash"
              echo "   新提交：$hash"

              UPDATED=true

            else
              echo "无更新：$name"
            fi
          done

          # 固定排序，避免状态文件顺序变化
          mkdir -p "$(dirname "$STATE_FILE")"
          sort -o "$TEMP_FILE" "$TEMP_FILE"

          # 保存本次检查结果
          cp "$TEMP_FILE" "$STATE_FILE"

          echo
          echo "=================================================="

          if [ "$BASELINE" = "true" ]; then
            echo "首次检查完成，已建立提交基线。"
          elif [ "$UPDATED" = "true" ]; then
            echo "检测到第三方组件更新，将触发编译。"
          else
            echo "所有第三方组件均无更新。"
          fi

          if [ -n "$FAILED" ]; then
            echo "⚠️ 以下组件检查失败：$FAILED"
          fi

          echo "=================================================="

          echo "baseline=$BASELINE" >> "$GITHUB_OUTPUT"
          echo "updated=$UPDATED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"

      # ======================================================
      # 3. 保存上游提交状态
      # ======================================================

      - name: Save upstream state
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/upstream-state/previous.txt

          if git diff --cached --quiet; then
            echo "上游状态文件没有变化，无需提交。"
          else
            git commit -m "chore: update third-party upstream state"
            git pull --rebase origin main || true
            git push
            echo "✅ 上游提交状态已保存。"
          fi

      # ======================================================
      # 4. 检测到任意第三方组件更新后触发编译
      # ======================================================

      - name: Trigger OpenWrt build
        if: |
          steps.check.outputs.baseline == 'false' &&
          steps.check.outputs.updated == 'true'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: Upstream Triggered Build
          client-payload: |
            {
              "reason": "third-party-updated",
              "run_id": "${{ github.run_id }}"
            }
