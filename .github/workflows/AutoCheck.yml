name: Auto Update Check

on:
  # 允许手动检查
  workflow_dispatch:

  # 每天北京时间凌晨 5 点（UTC 21:17，避开整点调度高峰）
  schedule:
    - cron: '17 21 * * *'

# 默认只读；只有 check job 里的状态提交/派发需要写权限
permissions:
  contents: read

# 防止多个检查任务同时修改状态文件
concurrency:
  group: auto-update-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # 保存状态文件 + 派发 repository_dispatch

    steps:
      # ======================================================
      # 1. 获取当前工作流仓库
      # ======================================================

      - name: Checkout workflow repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # ======================================================
      # 2. 检查全部第三方组件
      #    清单必须与 diy-part1.sh 的 feeds + diy-part2.sh 的
      #    git clone 保持一致，新增依赖时两边同步改。
      # ======================================================

      - name: Check third-party repositories
        id: check
        shell: bash
        run: |
          set -Eeuo pipefail

          STATE_DIR=".github/upstream-state"
          STATE_FILE="$STATE_DIR/previous.txt"
          mkdir -p "$STATE_DIR"
          # 临时文件与状态文件同目录，最后 mv 原子替换，避免中途失败留下半截状态
          TEMP_FILE="$(mktemp "$STATE_DIR/.previous.txt.XXXXXX")"
          trap 'rm -f "$TEMP_FILE"' EXIT

          # ==================================================
          # feeds（diy-part1.sh）
          # ==================================================
          #
          # DDNS-GO
          # KixDNS
          # Diskman
          # DAE
          # OpenNextTrace
          # Airplay2
          # Honk
          # Photondns
          # Nikki
          # Mosdns
          # OpenAppFilter
          # AtomDNS
          #
          # ==================================================
          # git clone 直接克隆（diy-part2.sh）
          # ==================================================
          #
          # v2ray-geodata（替换官方包）
          # Temp Status
          # Argon 主题
          # Pulse
          # Oxidns
          # Lucky（自有打包层，每日自动 pin 官网最新核心）
          # HevSocks5（hev-socks5-server 的 LuCI 控制页）
          #
          # ==================================================

          declare -A REPOS=(
            ["ddnsgo"]="sirpdboy/luci-app-ddns-go"
            ["kixdns"]="JohnsonRan/luci-app-kixdns"
            ["diskman"]="sbwml/luci-app-diskman"
            ["opennexttrace"]="haohaoget/luci-app-open_nexttrace"
            ["airplay2"]="NetForgeCN/luci-app-airplay2"
            # honk 与 dae 已整合进 luci-app-daeuniverse（旧 luci-app-dae 归档）
            ["honk"]="QiuSimons/luci-app-daeuniverse"
            ["photondns"]="c2h2/luci-app-photondns"
            ["nikki"]="nikkinikki-org/OpenWrt-nikki"
            ["mosdns"]="sbwml/luci-app-mosdns"
            ["v2ray-geodata"]="NetForgeCN/Loyalsoldier"
            ["temp-status"]="gSpotx2f/luci-app-temp-status"
            ["argon"]="jerrykuku/luci-theme-argon"
            ["pulse"]="w9315273/luci-app-pulse"
            ["oxidns"]="NetForgeCN/luci-app-oxidns"
            ["lucky"]="NetForgeCN/luci-app-lucky"
            ["openappfilter"]="destan19/OpenAppFilter"
            ["atomdns"]="NetForgeCN/luci-app-atomdns"
            ["hevsocks5"]="NetForgeCN/luci-app-hevsocks5"
          )

          declare -A OLD_HASHES=()

          BASELINE=false
          UPDATED=false
          FAILED=""

          echo "=================================================="
          echo " 检查第三方组件上游更新"
          echo "=================================================="

          # 读取上次检查记录
          if [ -f "$STATE_FILE" ]; then
            while read -r name hash; do
              [ -n "${name:-}" ] || continue
              [ -n "${hash:-}" ] || continue

              OLD_HASHES["$name"]="$hash"
            done < "$STATE_FILE"
          else
            BASELINE=true
            echo "首次运行，将建立上游提交基线。"
          fi

          # 检查每个仓库的默认分支 HEAD
          for name in "${!REPOS[@]}"; do
            repo="${REPOS[$name]}"

            echo
            echo "检查组件：$name"
            echo "仓库地址：https://github.com/$repo"

            # step 是 `set -Eeuo pipefail`：ls-remote 一旦失败（上游临时不可达、
            # 限流、DNS 抖动），整条管道连带赋值会直接终止 step，下面那个
            # 「保留旧 hash、继续检查其他组件」的兜底分支根本到不了。
            # 这里单独吞掉失败并有限重试（3 次），最后才退化成空 hash 走兜底；
            # GIT_TERMINAL_PROMPT=0 防止凭据交互卡住定时任务。
            hash=""
            for attempt in 1 2 3; do
              hash="$(GIT_TERMINAL_PROMPT=0 git ls-remote "https://github.com/${repo}.git" HEAD 2>/dev/null | awk 'NR == 1 { print $1 }')" || hash=""
              if [ -n "$hash" ]; then break; fi
              if [ "$attempt" -lt 3 ]; then sleep 2; fi
            done

            # 单个仓库检查失败不再让整个监控挂掉：
            # 保留旧 hash、继续检查其他组件，最后统一标记失败
            if [ -z "$hash" ]; then
              echo "❌ 获取仓库提交失败：$repo（保留旧状态）"
              FAILED="$FAILED $name"

              old_hash="${OLD_HASHES[$name]:-}"
              # set -e 下裸 `[ -n ... ] && ...` 在条件为假时会终止整个 step
              if [ -n "$old_hash" ]; then
                printf '%s %s\n' "$name" "$old_hash" >> "$TEMP_FILE"
              fi
              continue
            fi

            printf '%s %s\n' "$name" "$hash" >> "$TEMP_FILE"

            old_hash="${OLD_HASHES[$name]:-}"

            if [ "$BASELINE" = "true" ]; then
              echo "建立基线：$name $hash"

            elif [ -z "$old_hash" ]; then
              echo "⚠️ 新增监控组件：$name"
              echo "   视为发生变化，需要触发编译。"

              UPDATED=true

            elif [ "$hash" != "$old_hash" ]; then
              echo "✅ 检测到更新：$name"
              echo "   旧提交：$old_hash"
              echo "   新提交：$hash"

              UPDATED=true

            else
              echo "无更新：$name"
            fi
          done

          # 固定排序，避免状态文件顺序变化
          mkdir -p "$(dirname "$STATE_FILE")"
          sort -o "$TEMP_FILE" "$TEMP_FILE"

          # 保存本次检查结果：同目录原子替换（mktemp 默认 0600，显式恢复 644）
          chmod 644 "$TEMP_FILE"
          mv -f "$TEMP_FILE" "$STATE_FILE" || { echo "::error::保存状态文件失败"; exit 1; }

          echo
          echo "=================================================="

          if [ "$BASELINE" = "true" ]; then
            echo "首次检查完成，已建立提交基线。"
          elif [ "$UPDATED" = "true" ]; then
            echo "检测到第三方组件更新，将触发编译。"
          else
            echo "所有第三方组件均无更新。"
          fi

          if [ -n "$FAILED" ]; then
            echo "⚠️ 以下组件检查失败：$FAILED"
          fi

          echo "=================================================="

          echo "baseline=$BASELINE" >> "$GITHUB_OUTPUT"
          echo "updated=$UPDATED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"

      # ======================================================
      # 3. 保存上游提交状态
      # ======================================================

      - name: Save upstream state
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/upstream-state/previous.txt

          if git diff --cached --quiet; then
            echo "上游状态文件没有变化，无需提交。"
          else
            git commit -m "chore: update third-party upstream state"
            # rebase 失败必须让 step 失败；忽略后再 push 会写入过期状态或静默丢失提交
            git pull --rebase origin main || { echo "::error::rebase 上游失败"; exit 1; }
            git push
            echo "✅ 上游提交状态已保存。"
          fi

      # ======================================================
      # 4. 检测到任意第三方组件更新后触发编译
      # ======================================================

      - name: Trigger OpenWrt build
        if: |
          steps.check.outputs.baseline == 'false' &&
          steps.check.outputs.updated == 'true'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: Upstream Triggered Build
          client-payload: |
            {
              "reason": "third-party-updated",
              "run_id": "${{ github.run_id }}"
            }
