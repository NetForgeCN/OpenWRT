name: Debug Openssh Build

# 调试工作流（第三轮）：定位 "openssh failed to build (build variant: without-pam)"。
#
# 前两轮已排除（均通过）：
#   - 上游 openssh 10.6p2 本身（官方 buildbot 也构建成功）
#   - 工具链缓存、dl 缓存、ccache 缓存
#   - diy-part1 / diy-part2 的全部改动（Rust/Golang/geodata/内核配置/额外包）
#   - make download、make package/cleanup、target/linux 内核编译
#
# 剩余唯一变量：完整 package/compile 全量并发构建。本工作流：
#   1. 真实跑 `make package/compile -jN -k`（不中断，收集所有失败包）
#   2. 检查 OOM 记录
#   3. 随后在同一环境单独重编 openssh（-j1 V=s）抓取真实报错
#
# 排查完成后可直接删除本文件。

on:
  workflow_dispatch:

concurrency:
  group: debug-openssh
  cancel-in-progress: false

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: main
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  FEEDS_CONF: feeds.conf.default
  TZ: Asia/Shanghai
  DEBIAN_FRONTEND: noninteractive
  CCACHE_DIR: ${{ github.workspace }}/openwrt/.ccache

jobs:
  debug:
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Init environment
      run: |
        sudo apt-get -qq update
        sudo apt-get -qq install -y \
          clang llvm lld unzip ccache \
          bzip2 g++ gawk gcc git glibc-source libncurses-dev make \
          python3 rsync file patch bison flex zlib1g-dev libssl-dev \
          libelf-dev bc cpio gettext swig time

    - name: Clone source
      run: |
        git clone -b "$REPO_BRANCH" "$REPO_URL" openwrt

    - name: Compute toolchain hash
      id: toolchain-hash
      run: |
        cd openwrt
        HASH=$(git log --pretty=tformat:%h -n1 -- tools toolchain)
        echo "hash=${HASH:-none}" >> "$GITHUB_OUTPUT"

    - name: Restore toolchain cache
      id: toolchain-restore
      uses: actions/cache/restore@v6
      with:
        path: openwrt/staging_dir
        key: toolchain-${{ runner.os }}-x86-${{ steps.toolchain-hash.outputs.hash }}
        restore-keys: |
          toolchain-${{ runner.os }}-x86-

    - name: Restore dl cache
      uses: actions/cache/restore@v6
      with:
        path: openwrt/dl
        key: dl-${{ runner.os }}-x86-debug-${{ matrix.name }}
        restore-keys: |
          dl-${{ runner.os }}-x86-

    - name: Restore ccache
      id: ccache-restore
      uses: actions/cache/restore@v6
      with:
        path: openwrt/.ccache
        key: ccache-${{ runner.os }}-x86-${{ steps.toolchain-hash.outputs.hash }}-matrix-${{ matrix.name }}
        restore-keys: |
          ccache-${{ runner.os }}-x86-${{ steps.toolchain-hash.outputs.hash }}-
          ccache-${{ runner.os }}-x86-

    - name: Load custom feeds
      run: |
        set -e
        [ -e "$FEEDS_CONF" ] && cp "$FEEDS_CONF" openwrt/feeds.conf.default
        chmod +x "$DIY_P1_SH"
        ( cd openwrt && "$GITHUB_WORKSPACE/$DIY_P1_SH" )

    - name: Update feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load config
      run: |
        cd openwrt
        cp "$GITHUB_WORKSPACE/.config" .config

    - name: Run diy-part2
      run: |
        set -e
        chmod +x "$DIY_P2_SH"
        ( cd openwrt && "$GITHUB_WORKSPACE/$DIY_P2_SH" )

    - name: Make defconfig
      run: |
        cd openwrt
        make defconfig
        grep -E 'CONFIG_PACKAGE_openssh|CONFIG_CCACHE' .config || true

    - name: Download packages
      run: |
        cd openwrt
        find dl -size 0 -delete || true
        make download -j"$(nproc)" || true

    - name: Package cleanup (world prerequisite)
      run: |
        cd openwrt
        make package/cleanup

    - name: Resource snapshot
      run: |
        nproc; df -h / ; free -h || true

    - name: Compile ALL packages (keep going, no abort)
      run: |
        cd openwrt
        export FORCE_UNSAFE_CONFIGURE=1
        mkdir -p "$CCACHE_DIR"
        ccache -z || true
        set -o pipefail
        make package/compile -j"$(($(nproc)+1))" -k 2>&1 | tee pkg-compile.log || true
        echo "===== 失败包清单 ====="
        grep 'failed to build' pkg-compile.log | sort -u | head -30 || true
        echo "===== openssh 相关行 ====="
        grep -n 'openssh' pkg-compile.log | tail -20 || true

    - name: OOM check
      if: always()
      run: |
        sudo dmesg -T 2>/dev/null | grep -iE 'out of memory|oom-kill|killed process' | tail -10 || echo "无 OOM 记录"

    - name: Retry openssh alone with V=s
      if: always()
      run: |
        cd openwrt
        export FORCE_UNSAFE_CONFIGURE=1
        set -o pipefail
        make package/feeds/packages/openssh/clean || true
        make package/feeds/packages/openssh/compile -j1 V=s 2>&1 | tee openssh-retry.log || true
        echo "===== 重试结果 =====";
        grep -E 'failed to build|Error [0-9]|error:' openssh-retry.log | tail -30 || true

    - name: Trim package log
      if: always()
      run: |
        cd openwrt
        tail -400 pkg-compile.log > pkg-compile-tail.log 2>/dev/null || true
        ls -la *.log || true

    - name: Upload debug log
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: openssh-world-debug
        path: |
          openwrt/openssh-retry.log
          openwrt/pkg-compile-tail.log
          openwrt/logs/
          openwrt/.config
        if-no-files-found: ignore
        retention-days: 7
