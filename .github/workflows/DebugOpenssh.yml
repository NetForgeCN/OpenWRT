name: Debug Openssh Build

# 调试工作流（矩阵版）：定位 "openssh failed to build (build variant: without-pam)"。
#
# 背景：干净环境（工具链缓存命中、无 ccache、不跑 diy-part2）下 openssh 10.6p2
# 能正常编译（基线已通过）。本矩阵验证剩余两个变量：
#   - 是否恢复 ccache 缓存（主构建会恢复约 1GB ccache）
#   - 是否执行 diy-part2.sh（Rust/Golang/geodata/内核配置等改动）
#
# 组合：ccache+diy2 / ccache 单独 / diy2 单独（无 cache 无 diy2 的基线已验证通过）
# 排查完成后可直接删除本文件。

on:
  workflow_dispatch:

concurrency:
  group: debug-openssh
  cancel-in-progress: false

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: main
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  FEEDS_CONF: feeds.conf.default
  TZ: Asia/Shanghai
  DEBIAN_FRONTEND: noninteractive
  CCACHE_DIR: ${{ github.workspace }}/openwrt/.ccache

jobs:
  debug:
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ccache-diy2
            use_ccache: true
            use_diy2: true
          - name: ccache-only
            use_ccache: true
            use_diy2: false
          - name: diy2-only
            use_ccache: false
            use_diy2: true
    name: openssh-${{ matrix.name }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Init environment
      run: |
        sudo apt-get -qq update
        sudo apt-get -qq install -y \
          clang llvm lld unzip ccache \
          bzip2 g++ gawk gcc git glibc-source libncurses-dev make \
          python3 rsync file patch bison flex zlib1g-dev libssl-dev \
          libelf-dev bc cpio gettext swig time

    - name: Clone source
      run: |
        git clone -b "$REPO_BRANCH" "$REPO_URL" openwrt

    - name: Compute toolchain hash
      id: toolchain-hash
      run: |
        cd openwrt
        HASH=$(git log --pretty=tformat:%h -n1 -- tools toolchain)
        echo "hash=${HASH:-none}" >> "$GITHUB_OUTPUT"

    - name: Restore toolchain cache
      id: toolchain-restore
      uses: actions/cache/restore@v6
      with:
        path: openwrt/staging_dir
        key: toolchain-${{ runner.os }}-x86-${{ steps.toolchain-hash.outputs.hash }}
        restore-keys: |
          toolchain-${{ runner.os }}-x86-

    - name: Restore dl cache
      uses: actions/cache/restore@v6
      with:
        path: openwrt/dl
        key: dl-${{ runner.os }}-x86-debug-${{ matrix.name }}
        restore-keys: |
          dl-${{ runner.os }}-x86-

    - name: Restore ccache if enabled
      if: matrix.use_ccache
      uses: actions/cache/restore@v6
      with:
        path: openwrt/.ccache
        key: ccache-${{ runner.os }}-x86-${{ steps.toolchain-hash.outputs.hash }}-matrix-${{ matrix.name }}
        restore-keys: |
          ccache-${{ runner.os }}-x86-${{ steps.toolchain-hash.outputs.hash }}-
          ccache-${{ runner.os }}-x86-

    - name: Load custom feeds
      run: |
        set -e
        [ -e "$FEEDS_CONF" ] && cp "$FEEDS_CONF" openwrt/feeds.conf.default
        chmod +x "$DIY_P1_SH"
        ( cd openwrt && "$GITHUB_WORKSPACE/$DIY_P1_SH" )

    - name: Update feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load config
      run: |
        cd openwrt
        cp "$GITHUB_WORKSPACE/.config" .config

    - name: Run diy-part2 if enabled
      if: matrix.use_diy2
      run: |
        set -e
        chmod +x "$DIY_P2_SH"
        ( cd openwrt && "$GITHUB_WORKSPACE/$DIY_P2_SH" )

    - name: Make defconfig
      run: |
        cd openwrt
        make defconfig
        grep -E 'CONFIG_PACKAGE_openssh|CONFIG_CCACHE' .config || true

    - name: Compile openssh with V=s
      run: |
        cd openwrt
        export FORCE_UNSAFE_CONFIGURE=1
        mkdir -p "$CCACHE_DIR"
        ccache -z || true
        set -o pipefail
        make package/feeds/packages/openssh/compile -j"$(($(nproc)+1))" V=s 2>&1 | tee openssh-debug.log
        ccache -s || true

    - name: Upload debug log
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: openssh-debug-${{ matrix.name }}
        path: |
          openwrt/openssh-debug.log
          openwrt/logs/
          openwrt/.config
        if-no-files-found: ignore
        retention-days: 7
