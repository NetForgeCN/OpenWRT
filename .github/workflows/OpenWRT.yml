name: OpenWrt Firmware Build (x86 Master)

on:
  workflow_dispatch:
  repository_dispatch:

# 构建一次 3 小时以上，宁可排队也不要取消在跑的构建
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: main
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  FEEDS_CONF: feeds.conf.default
  TZ: Asia/Shanghai
  DEBIAN_FRONTEND: noninteractive
  # ⚠️ 必须是 openwrt/.ccache，不是 ~/.ccache。
  # OpenWrt 的 rules.mk 在 CONFIG_CCACHE=y 时执行
  #   export CCACHE_DIR := $(if $(CONFIG_CCACHE_DIR),$(CONFIG_CCACHE_DIR),$(TOPDIR)/.ccache)
  # TOPDIR 就是 openwrt/，所以构建实际读写的缓存目录在 openwrt/.ccache。
  # 这里显式钉住同一个路径，保证下面的 ccache -M 和缓存步骤操作的是同一份数据。
  CCACHE_DIR: ${{ github.workspace }}/openwrt/.ccache

jobs:
  # ============================================================
  # build：只给读权限。这一步会执行大量第三方 feeds / 软件包的
  # Makefile，万一上游被投毒，也不该拿到仓库写权限。
  # ============================================================
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
    # 🧾 1. 拉取仓库（含 .config 等配置）
    # persist-credentials: false —— 不把 token 留在 .git/config 里，
    # 第三方 Makefile 即使恶意也无法读取凭据
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    # 🧰 2. 初始化环境
    - name: Init environment
      run: |
        echo "===== 系统信息 ====="
        uname -a
        lsb_release -a || true
        free -h
        df -hT
        sudo apt-get -qq update
        sudo apt-get -qq install -y \
          clang llvm lld unzip ccache \
          bzip2 g++ gawk gcc git glibc-source libncurses-dev make \
          python3 rsync file patch bison flex zlib1g-dev libssl-dev \
          libelf-dev bc cpio gettext swig time
        
        sudo timedatectl set-timezone Asia/Shanghai
        
        sudo apt-get -qq autoremove --purge -y
        sudo apt-get -qq clean

    # 🔄 3. 拉取 OpenWrt 源码 —— 完整历史（不用浅克隆），
    # 这样 `git log -- tools toolchain` 才能算出稳定的缓存 key
    - name: Clone source
      run: |
        git clone -b "$REPO_BRANCH" "$REPO_URL" openwrt
        cd openwrt
        OPENWRT_COMMIT=$(git rev-parse HEAD)
        echo "OpenWrt commit: $OPENWRT_COMMIT"
        echo "OPENWRT_COMMIT=$OPENWRT_COMMIT" >> "$GITHUB_ENV"

    # 🔑 4. 计算工具链 hash，作为缓存 key 的一部分
    - name: Compute toolchain hash
      id: toolchain-hash
      run: |
        cd openwrt
        HASH=$(git log --pretty=tformat:%h -n1 -- tools toolchain)
        echo "hash=${HASH:-none}" >> "$GITHUB_OUTPUT"

    # 💾 5. dl 缓存（源码包下载目录）
    # key 从固定字符串改成绑定配置文件的哈希：
    # 固定 key 的缓存一旦命中就永不刷新（actions/cache 只在 miss 时上传），
    # 之后新增的源码包永远要重新下载，只能靠手改 -v1 才能更新。
    # 现在 .config / diy-part*.sh 变了才换 key，其余时候仍然命中同一份快照。
    - name: Cache dl
      uses: actions/cache@v6
      with:
        path: openwrt/dl
        key: dl-${{ runner.os }}-x86-${{ hashFiles('.config', 'diy-part1.sh', 'diy-part2.sh') }}
        restore-keys: |
          dl-${{ runner.os }}-x86-

    # 💾 6. 工具链缓存（staging_dir，命中后省 1.5~2.5 小时）
    # 用 restore / save 拆分而不是 actions/cache：
    # 保存步骤放到 job 末尾并加 if: always()，编译失败时也能把已经建好的
    # staging_dir 存下来，下次不必从零重来。
    - name: Restore toolchain cache
      id: toolchain-restore
      uses: actions/cache/restore@v6
      with:
        path: openwrt/staging_dir
        key: toolchain-${{ runner.os }}-x86-${{ steps.toolchain-hash.outputs.hash }}
        restore-keys: |
          toolchain-${{ runner.os }}-x86-

    # 💾 7. ccache 缓存
    # key 里带 run_id：每次运行都写一份新的快照（ccache 内容每轮都在变，
    # 固定 key 会导致它永远停留在第一次保存的状态），靠 restore-keys 前缀
    # 命中上一轮，超出配额时由 GitHub 按 LRU 淘汰最老的几代。
    - name: Restore ccache
      id: ccache-restore
      uses: actions/cache/restore@v6
      with:
        path: openwrt/.ccache
        key: ccache-${{ runner.os }}-x86-${{ steps.toolchain-hash.outputs.hash }}-${{ github.run_id }}
        restore-keys: |
          ccache-${{ runner.os }}-x86-${{ steps.toolchain-hash.outputs.hash }}-
          ccache-${{ runner.os }}-x86-

    # 🔑 8. 加载自定义 feeds
    - name: Load custom feeds
      run: |
        set -e
        [ -e "$FEEDS_CONF" ] && cp "$FEEDS_CONF" openwrt/feeds.conf.default
        chmod +x "$DIY_P1_SH"
        ( cd openwrt && "$GITHUB_WORKSPACE/$DIY_P1_SH" )

    # ⚙️ 9. 更新 & 安装 feeds
    - name: Update feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    # 📝 10. 加载自定义配置 (.config & diy-part2.sh)
    - name: Load custom configuration
      run: |
        set -e
        [ -e files ] && cp -a files openwrt/files
        [ -e .config ] && cp .config openwrt/.config
        chmod +x "$DIY_P2_SH"
        ( cd openwrt && "$GITHUB_WORKSPACE/$DIY_P2_SH" )
        ( cd openwrt && make defconfig )

    # 🛠️ 11. 安装 honk 宿主机工具链（仅当 .config 选中 honk 时执行）
    # honk 的核心不在 OpenWrt 构建树里交叉编译：honk/build_honk_core.sh 调用
    # 宿主机的 Rust/cargo + Zig + bpf-linker 现场编 honk-core，版本由上游钉死
    # （Zig 用 `zig version` 严格比对，不等就退出）。缺了会在 honk 包编译阶段
    # 直接失败，所以在 .config 定稿之后、make download 之前装好。
    # 下面三个版本号必须与 openwrt-suite README「宿主机依赖（honk 核心专用）」
    # 以及 OpenWrt-ScriptBuild/compile.sh 的 HONK_* 常量保持一致。
    - name: Install honk toolchain
      run: |
        set -euo pipefail
        ZIG_VERSION=0.14.1
        BPF_LINKER_VERSION=0.11.0
        # zig / bpf-linker 的资产名和 sha256 随「宿主机」架构变（不是目标架构）
        BPF_LINKER_SHA256_X86_64=10f62ba9ab7e544d538370552660efcb4f1a19153d5752bbf0f6b51f3bada450
        BPF_LINKER_SHA256_AARCH64=d09ddd83303e9ab1443f51e0e284680154009646a3ce141c63d838ee61b73eb9
        case "$(uname -m)" in
          x86_64|amd64)  HOST_ARCH=x86_64;  BPF_LINKER_SHA256=$BPF_LINKER_SHA256_X86_64 ;;
          aarch64|arm64) HOST_ARCH=aarch64; BPF_LINKER_SHA256=$BPF_LINKER_SHA256_AARCH64 ;;
          *) echo "::error::不支持的宿主机架构 $(uname -m)"; exit 1 ;;
        esac
        echo "honk 工具链宿主机架构：$HOST_ARCH"

        if ! grep -qE '^CONFIG_PACKAGE_honk=[ym]' openwrt/.config; then
          echo "未选中 honk（.config 无 CONFIG_PACKAGE_honk=y），跳过 honk 工具链安装"
          exit 0
        fi

        echo "===== 安装 honk 构建依赖 ====="
        sudo apt-get -qq update
        sudo apt-get -qq install -y libbpf-dev cmake libclang-dev zstd xz-utils pkg-config

        if ! command -v cargo >/dev/null 2>&1; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
        fi
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        # shellcheck disable=SC1091
        . "$HOME/.cargo/env"

        if ! command -v bpf-linker >/dev/null 2>&1 || ! bpf-linker --version >/dev/null 2>&1; then
          curl -fsSL --retry 3 -o /tmp/bpf-linker.tar.zst \
            "https://github.com/aya-rs/bpf-linker/releases/download/v${BPF_LINKER_VERSION}/bpf-linker-${HOST_ARCH}-unknown-linux-musl.tar.zst"
          echo "${BPF_LINKER_SHA256}  /tmp/bpf-linker.tar.zst" | sha256sum -c -
          sudo tar --zstd -xf /tmp/bpf-linker.tar.zst -C /usr/local/bin
        fi

        if ! command -v zig >/dev/null 2>&1 || [ "$(zig version)" != "$ZIG_VERSION" ]; then
          curl -fsSL --retry 3 -o /tmp/zig.tar.xz \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-${HOST_ARCH}-linux-${ZIG_VERSION}.tar.xz"
          sudo tar -xJf /tmp/zig.tar.xz -C /usr/local
          sudo ln -sf "/usr/local/zig-${HOST_ARCH}-linux-${ZIG_VERSION}/zig" /usr/local/bin/zig
        fi

        zig version
        bpf-linker --version || true
        cargo --version

    # 📦 12. 下载依赖包（多线程 + 自动清除零字节损坏包）
    - name: Download packages
      run: |
        cd openwrt
        find dl -size 0 -delete || true
        find dl -name "*.tmp" -delete || true
        make download -j"$(nproc)"
        find dl -size 0 -delete || true

    # 🏗️ 13. 编译固件
    # 不再做 `make -j1 V=s` 兜底：冷编译都要 3 小时，单线程重编必然
    # 撞 360 分钟超时，而且会掩盖真正的错误。输出 tee 进 build.log。
    # ccache 目录由 env.CCACHE_DIR 指定为 openwrt/.ccache，与 rules.mk 一致。
    - name: Compile firmware
      run: |
        cd openwrt
        mkdir -p "$CCACHE_DIR"
        ccache -M 3G
        ccache -z
        echo "ccache dir: $(ccache -k cache_dir 2>/dev/null || echo "$CCACHE_DIR")"
        export FORCE_UNSAFE_CONFIGURE=1
        set -o pipefail

        # 自愈说明：并行全量构建下，个别包（实测为 openssh without-pam）会报
        #   ERROR: package/xxx failed to build
        # 而该包在并发结束后单独 clean + 重建可以通过（已在同一环境实测）。
        # 这里做有限轮自愈：并行编译 → 识别失败包 → 单包 V=s 重建 → 再并行编译。
        MAX_ATTEMPTS=3
        for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
          echo "===== 第 ${attempt}/${MAX_ATTEMPTS} 轮并行编译 ====="
          if make -j"$(($(nproc)+1))" 2>&1 | tee build.log; then
            echo "✅ 编译成功（第 ${attempt} 轮）"
            break
          fi

          FAILED_PKGS="$(grep -oE 'ERROR: [^ ]+ failed to build' build.log \
            | sed -E 's/^ERROR: //; s/ failed to build$//' | sort -u | tr '\n' ' ')"

          if [ -z "${FAILED_PKGS// /}" ]; then
            echo "::error::并行编译失败，但未能从日志中识别出失败包"
            exit 1
          fi

          echo "⚠️ 失败包：${FAILED_PKGS}"
          for pkg in $FAILED_PKGS; do
            log="retry-$(printf '%s' "$pkg" | tr '/' '_').log"
            echo ">>> 单包重建：$pkg"
            make "${pkg}/clean" || true
            make "${pkg}/compile" -j1 V=s 2>&1 | tee "$log" || \
              echo "::warning::单包重建失败：${pkg}（日志：${log}）"
          done

          if [ "$attempt" = "$MAX_ATTEMPTS" ]; then
            echo "::error::已重试 ${MAX_ATTEMPTS} 轮仍未通过，请查看 build.log"
            exit 1
          fi
        done

        echo "===== ccache 编译统计 ====="
        ccache -s

    # 📂 14. 检查固件输出 —— 断言主镜像存在且大于 5MB，
    # 残缺固件在这里就失败，而不是发一个空 Release
    - name: Check firmware
      run: |
        echo "===== 固件输出 ====="
        find openwrt/bin/targets -type f \( -name "*.img.gz" -o -name "*.img" -o -name "*.bin" \) -size +5M -print
        MAIN=$(find openwrt/bin/targets -type f -name "*squashfs-combined-efi.img.gz" -size +5M | head -n1)
        [ -n "$MAIN" ] || { echo "❌ 未生成有效的 squashfs-combined-efi 固件"; exit 1; }

    # 📦 15. 收集发布资产 + 元信息（commit、缓存 key 都写进 release notes）
    - name: Collect release assets
      run: |
        mkdir -p release-assets
        shopt -s nullglob
        cp -a openwrt/bin/targets/x86/64/*.img.gz \
              openwrt/bin/targets/x86/64/*.img \
              openwrt/bin/targets/x86/64/*.bin \
              openwrt/bin/targets/x86/64/*.manifest \
              openwrt/bin/targets/x86/64/*.buildinfo \
              release-assets/
        {
          echo "Build Time: $(TZ=Asia/Shanghai date)"
          echo "OpenWrt Commit: ${OPENWRT_COMMIT:-unknown}"
          echo "Toolchain Key: toolchain-${{ runner.os }}-x86-${{ steps.toolchain-hash.outputs.hash }}"
        } > release-assets/release-notes.txt
        ls -lh release-assets/

    # 📤 16. 上传固件 artifact（供 release job 发布）
    # 固件本身已经是 .img.gz，再压缩一遍纯属浪费几分钟，保留原始字节。
    # retention-days：Release 建好后 artifact 就没用了，不必占用 90 天。
    - name: Upload firmware artifact
      uses: actions/upload-artifact@v7
      with:
        name: firmware-x86-64
        path: release-assets/
        if-no-files-found: error
        retention-days: 3
        compression-level: 0

    # 🪵 17. 编译失败时上传完整日志（tee 出来的 build.log 一定有内容）
    - name: Upload build logs on failure
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: openwrt-build-logs
        path: |
          openwrt/build.log
          openwrt/retry-*.log
          openwrt/logs/
          openwrt/.config
        if-no-files-found: ignore
        retention-days: 7

    # 💾 18. 保存 ccache —— 每轮都存，下一轮靠 restore-keys 续上
    # if: always() 让编译失败 / 中途出错时也能保住已经产出的对象文件；
    # continue-on-error 保证缓存写失败（配额、网络）不会把成功的构建判红。
    - name: Save ccache
      if: always()
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        path: openwrt/.ccache
        key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

    # 💾 19. 保存工具链缓存 —— 只在本次是 miss 时保存，命中就不重复上传
    # （命中还上传会覆盖同名条目，且白白多花一两分钟）
    - name: Save toolchain cache
      if: always() && steps.toolchain-restore.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        path: openwrt/staging_dir
        key: ${{ steps.toolchain-restore.outputs.cache-primary-key }}

  # ============================================================
  # release：只有这个 job 拿到写权限。即使 build 阶段被投毒，
  # 攻击者也接触不到 GITHUB_TOKEN。
  # ============================================================
  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      # ❗关键：本 job 为了最小权限只下载 artifact，没有执行 checkout，
      # 因此工作目录里没有 .git。gh 默认要靠 `git remote` 推断目标仓库，
      # 会直接报 "failed to run git: fatal: not a git repository"。
      # 必须显式给出目标仓库（GH_REPO 或 --repo），gh 才会走 API 而不再碰 git。
      GH_REPO: ${{ github.repository }}
    steps:
    - name: Download firmware artifact
      uses: actions/download-artifact@v8
      with:
        name: firmware-x86-64
        path: release-assets

    # 🏷️ 20. 发布 Release
    # tag 精度到分钟，追加 run_id 后 6 位避免同分钟构建撞 tag
    - name: Create release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail

        TAG="OpenWrt-$(TZ=Asia/Shanghai date +"%Y%m%d-%H%M")-${GITHUB_RUN_ID: -6}"
        echo "Release tag: $TAG"

        # release-notes 由 build job 生成，缺失说明 artifact 内容不完整
        if [ ! -f release-assets/release-notes.txt ]; then
          echo "::error::缺少 release-assets/release-notes.txt"
          ls -la release-assets/ || true
          exit 1
        fi

        shopt -s nullglob
        files=(release-assets/*.img.gz release-assets/*.img release-assets/*.bin \
               release-assets/*.manifest release-assets/*.buildinfo)
        shopt -u nullglob

        # nullglob 下无匹配会得到空数组，gh 会静默发一个没有资产的 Release，这里显式拦住
        if [ "${#files[@]}" -eq 0 ]; then
          echo "::error::release-assets/ 下没有找到任何固件文件"
          ls -la release-assets/ || true
          exit 1
        fi

        echo "待上传 ${#files[@]} 个文件："
        printf '  %s\n' "${files[@]}"

        gh release create "$TAG" \
          --repo "$GH_REPO" \
          --title "$TAG" \
          --notes-file release-assets/release-notes.txt \
          "${files[@]}"

        echo "✅ Release 创建完成：https://github.com/$GH_REPO/releases/tag/$TAG"

    # 🗑️ 21. 删除旧 Release（保留最新 7 个；用 JSON 解析而不是 awk 取列，
    # 避免 Title 含空格时取错 tag）
    - name: Delete old releases
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        KEEP_RELEASES=7

        # 1) 同样必须带 --repo：本 job 没有 git 仓库，否则和 create 一样报错
        # 2) 用命令替换而不是管道：gh 失败会被 set -e 捕获，不会被管道吞掉
        # 3) 按 createdAt 显式倒序，不依赖 API 的返回顺序
        LIST="$(gh release list \
          --repo "$GH_REPO" \
          --limit 100 \
          --json tagName,createdAt \
          --jq 'sort_by(.createdAt) | reverse | .[].tagName')"

        TAGS=()
        while IFS= read -r line; do
          [ -n "$line" ] && TAGS+=("$line")
        done <<< "$LIST"

        echo "当前 Release 数量：${#TAGS[@]}（保留最新 $KEEP_RELEASES 个）"
        if [ "${#TAGS[@]}" -le "$KEEP_RELEASES" ]; then
          echo "无需清理"
          exit 0
        fi

        for tag in "${TAGS[@]:$KEEP_RELEASES}"; do
          [ -n "$tag" ] || continue
          echo "删除旧 Release: $tag"
          gh release delete "$tag" --repo "$GH_REPO" -y --cleanup-tag || true
        done
